internal_inconsistencies:
  - id: INC-1
    item: "bedrest TST"
    detail: "1111 min = 18 h 31, but the report writes 18 h 21. The stage sum (79+535+225+271 = 1110) confirms 1111 min."
    impact: "29 min below the 19 h convention, not 39 min; does not change the conclusion but must be corrected."
  - id: INC-2
    item: "absence of excessive daytime sleepiness"
    detail: "The report states 'absence de somnolence diurne excessive', but Epworth = 18/24 (severe subjective sleepiness). The correct statement is 'no objective sleepiness on MSLT despite severe subjective sleepiness'."
    impact: "The subjective-objective dissociation is the central finding and should not be written as absence of sleepiness."
  - id: INC-3
    item: "RLS clinic"
    detail: "The report states 'pas de clinique RLS typique', but the recorded complaints include unpleasant leg sensations relieved by movement, starting at rest/inactivity — i.e. the core RLS criteria."
    impact: "Probable RLS is under-recognized; ferritin 57 µg/L supports iron workup."
  - id: INC-4
    item: "PSG1 sleep onset latency"
    detail: "Table: 31.5 min. Conclusion: 14 min."
    impact: "Minor; both are non-pathological."
  - id: INC-5
    item: "bedrest sleep onset latency"
    detail: "Table: 18.5 min. Conclusion: 20 min."
    impact: "Minor."
  - id: INC-6
    item: "SpO2 nadir"
    detail: "Nadir 71.8 % in REM during bedrest, but 0 min below 90 %. A 71.8 % sample would normally register time below 90 %."
    impact: "Likely artifact or isolated sample; ask the lab to confirm."
  - id: INC-7
    item: "PLMS arousal association"
    detail: "PLMS index 76.5/h and 55.5/h, but 0.0/h associated with micro-arousal. This is unusual; confirm whether the association was scored."
    impact: "Determines whether PLMS is a plausible cause of fragmentation."

interpretation:
  excluded:
    - "Narcolepsy type 1 and type 2: no SOREMP on PSG (REM latency 211.5 min) or on 5 MSLT naps; mean MSLT latency 10.8 min; no cataplexy. No medication for ≥ 3 weeks before the PSG, so the MSLT is valid."
    - "Obstructive sleep apnea: AHI 2.7/h and 4.5/h (supine 7.5/7.7; REM 3.2/8.0). Subthreshold positional/REM tendency, not OSA."
  not_confirmed:
    - "Idiopathic hypersomnia: MSLT mean 10.8 min (> 8); habitual diary TST 8 h; bedrest TST 18 h 31 < 19 h convention. ICSD-3 would accept 24 h TST ≥ 11 h, but no 24 h measurement exists. Low-moderate probability; not fully excluded."
    - "UARS: no RERA/PES measurement; snoring not documented."
    - "Insufficient sleep syndrome / individual long sleep need: diary 8 h/night for 21 days; bedrest capacity 13.9 h/24 h equivalent. The individual need is not established."
  supported:
    - "Non-restorative, fragmented sleep: arousal index 18.9–20.9/h; 30–67 awakenings; 108–274 stage changes."
    - "Very high PLMS index (76.5/h, 55.5/h) with possible RLS."
    - "Subjective EDS (ESS 18/24) with normal objective sleepiness (MSLT 10.8 min): subjective-objective dissociation."
    - "Cognitive fatigue: vigilance percentile 4; sustained-attention omissions 1 → 4 → 7."
    - "Anxiety/depression (HAD-A 11, HAD-D 13) and insomnia (ISI 17)."

open_questions:
  - "Confirm the exact date of the last dose (≥ 3 weeks before the PSG) and whether any other medication was taken."
  - "Did the 3-week washout cover the questionnaires and the bedrest as well?"
  - "What did the 2018/2019 PSG actually show (REM latency, SOREMP)? The current study does not reproduce a narcoleptic pattern."
  - "Was a second PSG performed, as the report mentions 'double polysomnographie'?"
  - "Was the PLMS arousal association scored? 0.0/h is unusual with an index of 76.5/h."
  - "Is the 71.8 % SpO2 nadir real or an artifact?"
  - "What is the habitual 24 h TST on free days (actigraphy)?"
  - "Does the patient meet the four RLS criteria (URGE) on clinical interview?"
