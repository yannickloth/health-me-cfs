interpretation:
  framework_ref: "ch25 sec-10 (side effects as diagnostic probes), Pattern II and the ligand-receptor duality section"
  note: >
    Dizziness at the RLS starting dose is the exaggerated cardiovascular
    D2/D3 side-effect signal the framework predicts for supersensitive
    D2/D3 receptors: peripheral D2 vasodilation plus central D2
    sympathetic suppression produces orthostatic dizziness. Weakness and
    the visual disturbance are consistent with the same cardiovascular
    mechanism. Nausea was not reported: the area postrema (CTZ) emetic
    response is unreported, and dizziness without nausea points to
    cardiovascular D2 sensitivity rather than emetic supersensitivity.
    This is a pharmacodynamic (receptor-state) signal, not an allergy:
    it is expected to track dose, not time on drug.
  caveat: "Single-dose self-report without vital signs; a hypothesis, not a diagnosis."

