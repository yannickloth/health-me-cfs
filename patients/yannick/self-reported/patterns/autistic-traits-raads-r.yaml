description: |
  On 2026-09-24 the patient completed the RAADS-R and reports a VERY STRONG
  alignment with autistic traits. This is a self-administered screening
  result, not a clinical diagnosis. The instrument report states that no single
  RAADS-R score can diagnose or rule out autism, and that the original 65
  threshold identifies many non-autistic people; results should be read
  alongside developmental history, lived experience, masking, and other
  questionnaires.

interpretation:
  - "Adds a neurodevelopmental dimension to the lifelong-trait picture that
    already includes lifelong executive dysfunction (see
    pattern:lifelong_executive_dysfunction)."
  - "Reframes the earlier TDAH-vs-energetic-deficit differential: multiple
    formal ADHD tests were NEGATIVE, yet the patient has lifelong
    executive/attentional difficulty and a strong family history of ADHD
    (mother + 2 sisters). A positive autism screen is a different axis."
  - "Consistent with the project's documented neurodivergence–ME/CFS overlap
    literature (sensory sensitivity, interoception, autonomic traits)."

relationship_to_other_patterns:
  lifelong_executive_dysfunction: "Complementary — same lifelong/premorbid
    timeframe; autism traits may partly explain the executive profile that
    was previously attributed to energetics alone."
  family_history: "Mother and 2 sisters with ADHD diagnoses (per
    lifelong_executive_dysfunction)."

relevance_to_mecfs:
  - "Premorbid-trait / multi-hit model: neurodevelopmental substrate present
    long before the clinical ME/CFS threshold."
  - "Sensory and interoceptive traits overlap with the sensory-sensitivity
    and autonomic dimensions already documented for this patient."
  - "Possible relevance to masking/compensation history and to interoceptive
    accuracy in symptom self-report."

uncertainty:
  provisional: true
  note: "Screening only. The instrument report itself states it is not a
    diagnostic assessment; high scores have false-positive potential, and the
    Low/Moderate/High banding is not validated. Formal diagnostic assessment
    (ADOS-2 / ADI-R via a specialist) would be required for a diagnosis."

