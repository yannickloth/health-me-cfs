# MECHANISTIC HYPOTHESES
mechanistic_hypotheses:
  unifying_hypothesis:
    label: "dysregulated ion handling — cramps triggered by ion LOADS, not ion deficits"
    plausibility: "leading (2026-08-15) — unifies Mg correlation + electrolyte crash + episode features"
    reasoning: |
      The single most parsimonious explanation is that this patient's
      ion-channel/membrane system reacts abnormally to ION LOADS rather
      than reflecting ion DEFICITS. Three independent lines converge:
      - Mg correlation (2026-08-15): Mg intake HISTORICALLY correlates with
        cramp onset — the OPPOSITE of the Mg-deficiency model.
      - Electrolyte-induced pain crash (2026-01-31): electrolyte LOAD →
        diffuse joint/muscle pain ~3h later.
      - Episode features (2026-08-15): 10-15 min sustained discharge,
        antagonist crossover (neurogenic/spinal), partial cold-water relief
        (membrane-excitability driven).
      Both Mg and the electrolyte mix are ion loads. In a dysregulated
      channel, an ion flux can paradoxically LOWER the cramp/pain threshold
      instead of raising it. Mg/electrolyte here act as PROBES revealing a
      channel/transport problem, not as deficiencies to be corrected.
      This explains: why Mg does not relieve cramps, why cramps persist on
      LDA (ion-channel layer, not microglial), and why the electrolyte crash
      and cramps share the same ion-load trigger. Ion-channel (TRPM3 /
      Na+-channel) dysregulation is the leading candidate mechanism.
    tests: |
      Prospective: log ion intake (Mg form/dose/timing; electrolyte loads)
      against cramp and pain onset in daily symptom YAMLs. If episodes
      follow ion loads episode-by-episode, the ion-load model is confirmed.
      Passive monitoring only; no intentional provocation (recovery priority).
    physician_discussion: |
      Framing for Dr. Nicolas: this is likely a CHANNEL/TRANSPORT problem,
      not a level problem. A normal serum Mg/K+ does NOT exclude it.
      Relevant: ion-channel (TRPM3/Na+-channel) and small-fiber
      considerations; whether nerve-conduction/EMG is clinically indicated.
      See physician_discussion_points below.

  primary:
    label: "spinal motor-neuron hyperexcitability / lowered cramp threshold"
    plausibility: "elevated (2026-08-15 update)"
    reasoning: |
      Cramps at rest or minimal activity suggest lowered motor neuron
      excitability threshold, not mechanical overuse. Consistent with:
      - Ion channel dysregulation (TRPM3 channelopathy hypothesis in ME/CFS)
      - GPCR-mediated nociceptor sensitization (purinergic/adenosine axis)
      - Chronic sympathetic dominance altering motor neuron background tone

      STRENGTHENING EVIDENCE (2026-08-15):
      - 10-15 min duration (sustained motor-unit discharge, not transient)
      - Antagonist crossover on stretch: extending the cramping muscle
        triggers a cramp in its antagonist → disordered reciprocal
        inhibition / escaping spinal inhibition → NEUROGENIC (central/spinal)
        signature, argues against local muscle-fiber cause
      - Partial cold-water relief (cold lowers nerve-membrane excitability)
      - Persists under LDA → independent of the microglial/dopaminergic
        layer; a THIRD LDA-independent layer alongside tinnitus
      These features converge on spinal motor-neuron / nerve-membrane
      hyperexcitability (an excitability-threshold problem in the motor
      system), with ion-channel dysregulation as the leading candidate.
      Downgraded by these features: simple electrolyte/Mg depletion and
      local overuse/fatigue.

  secondary:
    label: "magnesium / electrolyte deficit"
    plausibility: "further downgraded (2026-08-15) — Mg intake CORRELATES with cramp onset"
    reasoning: |
      Mg²⁺ suppresses NMDA receptor excitability; deficiency lowers cramp threshold.
      Patient takes magnesium supplement but absorption/bioavailability variable.
      Intersects with GPCR pain pathways at the nociceptor level.
      See also: electrolyte-induced-pain-crash.yaml for electrolyte sensitivity context.

      CAVEAT (2026-08-15): the electrolyte/ion AXIS remains implicated
      (electrolyte-induced pain crash 2026-01-31; cramps persist despite Mg
      supplementation). But the 10-15 min duration and antagonist crossover
      are NOT explained by simple Mg/electrolyte depletion. Reframe: an
      ion-channel/transporter problem (membrane excitability), which Mg
      does not compensate, rather than straightforward depletion.

      STRONGER REFRAME (2026-08-15, magnesium_correlation): patient reports
      HISTORICAL correlation of Mg intake with cramp onset ("strange but
      real"). This is the OPPOSITE of the simple Mg-deficiency model and
      further demotes "Mg deficit" as the cause. It aligns with the
      electrolyte-induced pain crash (ion-axis reacts abnormally to ion
      LOADS, not just deficits) and with an ion-channel dysregulation where
      a Mg/ion shift alters membrane excitability adversely. See
      magnesium_correlation block above. Retrospective impression; needs
      prospective Mg-vs-cramp tracking to confirm.

  tertiary:
    label: "autonomic-mediated muscle ischemia"
    plausibility: "low-moderate"
    reasoning: |
      Dysregulated β2-adrenergic GPCRs (Scheibenbogen autoantibody hypothesis) →
      impaired vasodilation in muscle vasculature → local ischemia → cramp trigger.
      Mestinon (↑ACh → M3 muscarinic GPCR) partially compensates but may be incomplete.

      CAVEAT (2026-08-15): fits cramps with activity/orthostasis (ischemia
      under demand) less well than the excitability model. May AMPLIFY or
      set background tone for cramps, but does not easily explain the
      spontaneous, rest, no-trigger character with antagonist crossover.

  gpcr_connection: |
    See notes/gpcr-muscle-pain.md for full GPCR pathway context.
    Purinergic (P2Y) and adenosine (A1/A2) GPCRs can maintain elevated nociceptor
    sensitization between episodes, lowering cramp threshold even without acute trigger.

