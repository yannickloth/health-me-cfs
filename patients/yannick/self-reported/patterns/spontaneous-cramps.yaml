# ONGOING STATUS
ongoing_status:
  status: "persistent"
  last_confirmed: "2026-08-15"
  context: |
    Patient reports on 2026-08-15 that muscle cramps still occur "without
    apparent reason" while on Aripiprazole (LDA) 1mg/day. LDA controls PEM,
    mental fog, and migraines/headaches, but does NOT resolve spontaneous
    cramps. Cramp domain is LDA-independent.
  significance: |
    Persistence under LDA supports a cramp mechanism distinct from the
    PEM/neuroimmune axis that LDA modulates (microglial/dopaminergic).
    Consistent with existing hypotheses: neuronal hyperexcitability /
    lower cramp threshold, ion-channel dysregulation (TRPM3), electrolyte
    deficit, or autonomic-mediated muscle ischemia — NOT a
    microglial-driven process.
  evidence_gaps: |
    No episode-level detail (location, timing, frequency) captured on
    2026-08-15. Whether cramp frequency/severity changed on LDA vs off
    is not established — only presence confirmed.
  source: "notes/aripiprazole-status-muscle-cramps-2026-08.md"

# MAGNESIUM CORRELATION (reported 2026-08-15) — counterintuitive, needs tracking
magnesium_correlation:
  reported: |
    Patient has taken magnesium these days (2026-08-15 report). Patient
    states that HISTORICALLY, magnesium intake has CORRELATED with cramps
    coming on — "strange but real."
  direction: "magnesium intake associated with cramp onset (paradoxical)"
  significance: |
    This is mechanistically significant and COUNTERINTUITIVE to the simple
    "Mg deficiency lowers cramp threshold" hypothesis. If Mg intake is
    correlated with (not just coincidental to) cramp onset, then the cramp
    mechanism is NOT Mg depletion. Candidate reframes:
    - An ion-channel/transporter problem where a Mg/ion shift (not
      depletion) alters membrane excitability adversely.
    - Analogous to the electrolyte-induced pain crash (2026-01-31): this
      patient's ion axis reacts abnormally to ion LOADS, not just to
      deficits.
    - Mg can modulate TRPM3 (and other channels) — a paradoxical
      excitability response is possible if the channel is already
      dysregulated.
  caveats: |
    Correlation ≠ causation; "historically" is a retrospective impression,
    not a controlled/replicated observation. Timing, dose, and form of Mg
    not documented. Needs prospective tracking: log Mg intake vs cramp
    onset in daily symptom YAMLs to test the correlation.
  action: |
    Add Mg intake (form, dose, timing) to daily symptom logs and correlate
    with cramp episodes. Do NOT change or stop Mg based on this alone —
    passive monitoring only, per recovery-priority constraint.

# EPISODE CHARACTERISTICS (typical episode, reported 2026-08-15)
episode_characteristics:
  duration_minutes: "10-15"
  duration_semantic: |
    Far exceeds typical benign cramp (seconds to ~1 min). Suggests
    persistent, self-sustaining motor-unit discharge, not a transient
    trigger-response.
  stretch_response: "extending the cramping muscle triggers a cramp in its antagonist"
  stretch_response_semantic: |
    Disordered reciprocal inhibition / escaping spinal inhibition.
    Stretch normally relieves cramps via reciprocal inhibition of the
    cramping muscle's own motor pool. Antagonist crossover on stretch is
    a neurogenic (central/spinal) signature — NOT a local muscle-fiber
    problem. Strongly argues against simple local fatigue/overuse.
  cold_water_intervention: "placing foot in cold water — somewhat effective, not perfect"
  cold_water_semantic: |
    Cold lowers nerve conduction velocity and membrane excitability
    (reduces Na+-channel open probability, neuronal firing). Partial
    relief consistent with excitability-driven mechanism. Imperfect because
    cold also increases muscle-spindle afferent activity / stretch-reflex
    sensitivity, which can oppose the inhibition.
  aggregate_read: |
    Duration + antagonist-crossover + partial cold-water relief converge on
    spinal motor-neuron / nerve-membrane hyperexcitability (an
    excitability-threshold problem in the motor system). This is a THIRD
    LDA-independent layer alongside tinnitus, mechanistically orthogonal
    to the microglial/dopaminergic Layer-1 that LDA treats.
    Refuted / downgraded: simple electrolyte/magnesium depletion (would not
    produce antagonist crossover or 10-15 min duration); local muscle
    overuse/fatigue (cramps occur at rest, no exertion).

