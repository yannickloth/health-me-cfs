pem_risk:
  level: moderate
  rationale: >
    Vaccination is a recognised PEM trigger in ME/CFS. Two vaccines on the
    same day increases the immunological load compared to a single vaccine.
    The patient reports symptoms on 2026-11-10 consistent with a possible
    vaccine reaction or PEM onset.
  expected_onset: "2026-11-09 through 2026-11-11 (24–72 h post-vaccination)"
  monitoring: >
    Daily monitoring on 2026-11-10, 2026-11-11, and 2026-11-12. Record
    severity, symptom list, and return-to-baseline date if PEM develops.

hypotheses:
  - id: dual_vaccine_reaction
    text: >
      Two vaccines on the same day (flu + COVID-19) produced a post-vaccination
      reaction on 2026-11-10, presenting as fatigue and leg pain similar to
      exhaustion. This may be a direct vaccine reaction or a vaccine-triggered
      PEM episode. Cannot distinguish without comparing to single-vaccine
      reactions in this patient.
    status: observation
    falsifiable: true
    test: >
      Compare future single-vaccine events. If a single vaccine does not
      produce the same symptoms, the dual-vaccine load is the differentiating
      factor.

