pem_tracking:
  trigger_event: "Flu vaccine and COVID-19 vaccine on 2026-11-09."
  pem_day: 1
  status: >
    Patient reports tiredness and serious leg pain on 2026-11-10, the day
    after vaccination. This falls inside the patient's usual 24–72 h PEM
    onset window. The symptoms may represent a vaccine-triggered PEM or a
    direct vaccine reaction. The patient described the sensation as similar
    to exhaustion. Not clinician-assessed.
  notes: >
    Track for PEM development over the next 3 days. Record severity,
    symptom list expansion, and return-to-baseline date.

pem_risk:
  level: high
  rationale: >
    Symptoms already present on the first day after a dual-vaccine event.
    Vaccination is a recognised PEM trigger. The combination of two vaccines
    on the same day increases immunological load. Patient describes leg pain
    and exhaustion-like fatigue, consistent with PEM.
  expected_onset: ~
  monitoring: >
    Daily monitoring through 2026-11-12. Record any symptom changes,
    severity ratings, and the date of return to baseline.

hypotheses:
  - id: vaccine_triggered_pem_20261109
    text: >
      The dual vaccination on 2026-11-09 triggered a PEM episode with onset
      on 2026-11-10. The symptom profile is tiredness and serious leg pain
      similar to exhaustion. Onset is within the patient's usual 24–72 h
      window. The patient's baseline on 2026-11-09 is unknown; no PEM was
      reported for the vaccination day itself.
    status: observation
    falsifiable: true
    test: >
      Compare with future single-vaccine events. If single vaccines do not
      produce the same level of symptoms, the dual-vaccine load is the
      differentiating factor.

