    falsifiable: true
    test: "EMG/nerve-conduction distinguishing ectopic discharges (neurogenic) vs sarcolemmal abnormality (muscular) would discriminate the mechanism (see notes/myelin-energy-excitability-synthesis-2026-08.md)."

