    text: "The ≥45 min persistent cramp (vs prior 10-15 min) strengthens the neurogenic / sustained motor-unit discharge read. Consistent with the membrane-energy hypothesis (Na+/K+-ATPase + ion-channel insufficiency) unifying brain myelin and muscle cramp findings."
