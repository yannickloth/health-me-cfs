hypotheses:
  - id: sleep_restoration_not_single_night
    text: >
      One restored night (>8h, natural waking, no sleepiness) did NOT clear
      the muscle pain. This does NOT refute the sleep-link hypothesis: the
      predicted easing was for 1-2 weeks of restored sleep after weeks of
      cumulative debt on an alpha-intrusion baseline. A single good night
      cannot reverse accumulated load. Test window still open.
    status: patient_hypothesis
    falsifiable: true
    test: "Reassess after 1-2 weeks of sustained restored sleep. If diffuse pain eases with sustained sleep restoration, the sleep link is confirmed; if it persists after 1-2 weeks of restored sleep, the sleep attribution is weakened."
  - id: forearm_vascular_not_sleep_layer
    text: >
      The forearm pain (vascular 'amortir la chute' character) is a THIRD,
      distinct pain component — autonomic/vascular or positional, not the
      diffuse sleep-linked myalgia and not the cramp layer. It is therefore
      NOT testing the sleep-restoration hypothesis; a good night was never
      predicted to resolve vascular/orthostatic forearm pain.
    status: patient_hypothesis
    falsifiable: true
    test: "Position test (passive, no provocation): if forearm pain eases when arms are raised above heart level, supports vascular/orthostatic pooling origin (β2-adrenergic/M3 autonomic axis per notes/gpcr-muscle-pain.md); if position-independent, favors tissue/other mechanism."
  - id: forearm_back_thigh_positional_vascular
    text: >
      Pain present essentially in the forearms + back of thighs WHILE SITTING
      at the computer, vascular-character, CHRONIC (months) and BILATERAL,
      is consistent with vascular/orthostatic or compressive pooling
      (dependent forearms; compressed hamstrings/popliteal region at seat
      edge) rather than muscle damage or the diffuse myalgia. Bilateral +
      symmetric + chronic argues against local/traumatic cause. Fits the
      autonomic/vascular axis (β2-adrenergic/M3 GPCR dysregulation) already
      documented in notes/gpcr-muscle-pain.md.
    status: patient_hypothesis
    falsifiable: true
    test: "If pain eases on standing / walking / raising arms / changing posture (restoring venous return), confirms vascular/orthostatic or compressive pooling. If position-independent, revise toward a non-vascular mechanism."
  - id: layer_relatedness_unknown
    text: >
      Whether the forearm vascular pain shares one driver with the diffuse
      myalgia and the spontaneous cramps is UNRESOLVED. The three components
      have distinct mechanisms (sleep-linked microglial; neurogenic/
      excitability; autonomic/vascular) but may share a common autonomic/
      vascular or energy substrate. Relatedness is an open question pending
      prospective logging and the position test.
    status: patient_hypothesis
    falsifiable: true
    test: "Prospective daily logging of each component (location, trigger, position, character, sleep) + the passive position test would reveal whether the forearm pain tracks posture (vascular) independently of the other layers, or co-varies with sleep/exertion/cramps (shared driver)."
  - id: evening_migraine_pem_or_fatigue
    text: >
      Evening 2026-08-19: ME/CFS-type migraine + marked exertion aversion
      ('je n'ai envie de faire aucun effort') after a day that included an
      afternoon outing (Science Center Differdange). Ambiguity: is this a PEM
      (post-exertional malaise despite aripiprazole), or just intense fatigue?
      A migraine of ME/CFS type following exertion/sensory load could be a PEM
      signal; LDA does not fully abolish PEM per prior records. Distinct from
      the morning forearm vascular pain and the diffuse sleep-linked myalgia.
    status: patient_hypothesis
    falsifiable: true
    test: "Confirmation pending next-day (2026-08-20): if elevated fatigue / reduced functioning / additional ME/CFS-type symptoms persist the next day after normal rest, supports PEM (despite LDA); if the migraine resolves overnight with no next-day functional drop, it was intense fatigue / a transient sensory-load migraine rather than a full PEM episode. Log next-day status to discriminate."
  - id: mestinon_trial_will_test_vascular_axis
    text: >
      CORRECTION 2026-08-19: a prior hypothesis here stated the patient
      reported Mestinon was "probably good" for the vascular forearm pain.
      This claim is RETRACTED — the patient made no such claim, and no
      benefit is established. Whether Mestinon (pyridostigmine) benefits
      the forearm pain is an UNTESTED question. The ongoing 2026-08-19
      low-dose retrial (1 pill/day) is the first controlled evaluation:
      it tests whether ACh→M3 vasodilation (β2-adrenergic/M3 GPCR axis,
      notes/gpcr-muscle-pain.md) helps the vascular forearm pain WITHOUT
      the excess gut motility that forced the June stop. This is the only
      evidence source for the M3-vascular read.
    status: patient_hypothesis
    falsifiable: true
    test: "If the 1-pill/day retrial shows forearm-pain relief WITHOUT unacceptable GI motility, supports the M3-vascular axis. If no benefit or GI side-effect returns unacceptably, the trial fails and the M3-vascular read is unsupported. Passive observation only; recovery-priority constraint. Outcome to report for Dr. Nicolas discussion."

