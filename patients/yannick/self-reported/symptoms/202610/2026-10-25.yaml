hypotheses:
  - id: driving_plus_cleaning_cumulative_load
    text: >
      At LDA 1 mg, a Saturday load of IKEA shopping plus 3 h driving in two
      1.5 h blocks, followed by home cleaning on Sunday, was followed by PEM.
      On 2026-09-12, 3 h of driving at LDA 0.75 mg produced PEM with severe
      migraine; at 1 mg, ~5 h of chainsaw work produced none (2026-07-17).
      This episode is consistent with a cumulative multi-day load threshold
      rather than a single-activity threshold, but the components are
      confounded and the record does not establish it.
    status: observation
    falsifiable: true
    test: >
      Log future episodes by component (driving hours, store visit, household
      work) and by LDA dose. If PEM follows 3 h of driving alone at 1 mg, the
      driving component is sufficient. If it requires an added activity day,
      the threshold is cumulative.

