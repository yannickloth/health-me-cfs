hypotheses:
  - id: karcher_pem_now_probable
    text: >
      At ~48h post-Kärcher (2026-09-28) the patient attributes the state to
      PEM: strong persistent courbatures, marked fatigue, very little
      productivity, and 4h daytime sleep. This confirms the post-exertional
      mechanism that was only suspected on 2026-09-26/27. The 3-4h Kärcher
      episode (sustained grip + vibration + repetitive arm/hand work) appears
      to have induced a genuine PEM, unlike the 2026-07-17 ~5h chainsaw work
      at the same LDA 1mg dose which produced no symptoms.
    status: patient_hypothesis
    falsifiable: true
    test: >
      Confirm by the recovery timeline: if courbatures/fatigue resolve on the
      usual 5-7 day PEM course and function returns to baseline, supports PEM.
      The exertion-profile contrast (sustained arm/hand-dominant vs heavy
      intermittent) remains the open discriminator to test on future episodes.
  - id: lda_effective_but_incomplete
    text: >
      Patient clarification (2026-09-27): aripiprazole (LDA) IS effective
      but not perfect, and the patient could not do without it
      ("l'aripiprazole est efficace mais pas parfaite et je ne pourrais m'en
      passer"). It is indispensable, yet it does NOT cover the muscle-pain
      axis ("l'aripiprazole n'améliore rien de ce côté-là"). So LDA is an
      essential but PARTIAL therapy with an uncovered muscle dimension —
      not an ineffective drug. Today's probable PEM at 1mg is consistent
      with an LDA-uncovered muscle axis.
    status: patient_hypothesis
    falsifiable: true
    test: >
      Track both domains through future LDA changes: expect the
      LDA-responsive domain (sleep / sleep-deprivation decoupling) to worsen
      on reduction, while muscle pain remains unchanged at 0.75mg, 1mg, and
      1.5mg — confirming an effective-but-incomplete profile.

