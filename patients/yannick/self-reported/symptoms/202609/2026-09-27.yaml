hypotheses:
  - id: karcher_post_exertional_myalgia_spread
    text: >
      Pain spread to sites NOT used in Kärcher work, ~24h post-exertion,
      with courbature character and a stretching urge. The generalized,
      delayed pattern is consistent with a central/systemic post-exertional
      process, but there is no headache and no other systemic PEM feature,
      so PEM is NOT confirmed.
    status: patient_hypothesis
    falsifiable: true
    test: >
      Confirm PEM only if elevated fatigue / reduced function / additional
      ME/CFS-type symptoms persist over 24-72 h after normal rest. If the
      myalgia resolves on the usual PEM timeline (5-7 days), supports a
      post-exertional mechanism; if brief, it may be transient post-exertional
      soreness rather than PEM.
  - id: lda_effective_but_incomplete
    text: >
      Patient clarification (2026-09-27): aripiprazole (LDA) IS effective
      but not perfect, and the patient could not do without it
      ("l'aripiprazole est efficace mais pas parfaite et je ne pourrais m'en
      passer"). It is indispensable, yet it does NOT cover the muscle-pain
      axis ("l'aripiprazole n'améliore rien de ce côté-là"). So LDA is an
      essential but PARTIAL therapy with an uncovered muscle dimension —
      not an ineffective drug.
    status: patient_hypothesis
    falsifiable: true
    test: >
      Track both domains through future LDA changes: expect the
      LDA-responsive domain (sleep / sleep-deprivation decoupling) to worsen
      on reduction, while muscle pain remains unchanged at 0.75mg, 1mg, and
      1.5mg — confirming an effective-but-incomplete profile.
  - id: karcher_exertion_profile_trigger
    text: >
      Post-exertional symptoms followed 3-4h Kärcher work at LDA 1mg.
      Contrast: 2026-07-17 at 1mg, ~5h chainsaw work produced no such
      symptoms. Sustained grip + vibration + repetitive arm/hand motion +
      forward posture may be a stronger trigger for this patient than heavy
      intermittent work. Open question.
    status: patient_hypothesis
    falsifiable: true
    test: >
      Log future 1mg-dose exertion episodes by type. Repeated post-exertional
      symptoms after arm/hand-dominant sustained work, with none after heavy
      intermittent work, implicates the exertion profile.

