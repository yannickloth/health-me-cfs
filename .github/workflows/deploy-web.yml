name: Deploy Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build web site
        run: nix build .#web --print-build-logs

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-site
          path: result
          retention-days: 1

  deploy:
    needs: [ web ]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v6
        with:
          name: web-site
          path: web-site

      - name: Find build-pdf run for this commit
        uses: actions/github-script@v7
        id: find-run
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-pdf.yml',
              head_sha: context.sha,
              status: 'success',
              per_page: 1,
            });
            const run = runs.data.workflow_runs[0];
            if (!run) {
              core.warning('No successful build-pdf run found for this commit — deploying web without PDF');
              return '';
            }
            return run.id;

      - name: Download PDF from build-pdf run
        if: steps.find-run.outputs.result != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ steps.find-run.outputs.result }}
          name: me-cfs-paper
          path: web-site
          check_artifacts: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
