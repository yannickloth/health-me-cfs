name: Build PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable  # Accepts upstream breakage for latest deps
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix (optional - speeds up builds)
        # Enable by setting CACHIX_ENABLED=true in repository variables
        # Tradeoff: Faster builds vs dependency on external Cachix service
        # Falls back to local Nix build if disabled
        # See: https://cachix.org
        if: vars.CACHIX_ENABLED == 'true'
        uses: cachix/cachix-action@v14
        with:
          name: me-cfs-docs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Ensure swap space (typst compile exceeds runner RAM)
        run: |
          df -h /; free -h
          # Runner ships a small 3 GiB /swapfile. typst's monolithic compile
          # peaks ~17 GB and OOMs on 15 GB RAM + 3 GB swap. Add a distinct
          # second swapfile for real margin (guard on its own path so the
          # pre-existing /swapfile is preserved and this stays idempotent).
          if sudo swapon --show=NAME --noheadings --raw | grep -Fxq /swapfile-ci; then
            echo "/swapfile-ci already active"
          else
            sudo dd bs=1048576 count=8192 if=/dev/zero of=/swapfile-ci   # 8 GiB
            sudo chmod 600 /swapfile-ci
            sudo mkswap /swapfile-ci
            sudo swapon /swapfile-ci
          fi
          free -h

      - name: Build PDF with Nix
        run: nix build --print-build-logs --max-jobs 1

      - name: Rename PDF with date and commit
        run: |
          if [ ! -f "result/loth2026-mecfs.pdf" ]; then
            echo "ERROR: PDF file not found after build"
            exit 1
          fi
          DATETIME=$(date +%Y%m%d-%H%M%S)
          SHORT_SHA=${{ github.sha }}
          PDF_NAME="loth2026-mecfs.${DATETIME}-${SHORT_SHA}.pdf"
          cp result/loth2026-mecfs.pdf "$PDF_NAME"
          echo "PDF_NAME=$PDF_NAME" >> $GITHUB_ENV

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: me-cfs-paper
          path: ${{ env.PDF_NAME }}
          retention-days: 30

      - name: Create GitHub Release with PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Auto-release on every main branch push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PDF_NAME: ${{ env.PDF_NAME }}
        run: |
          set -euo pipefail
          NOTES="Latest PDF build from commit ${{ github.sha }} — Built: ${{ github.event.head_commit.timestamp }}"
          # Create/update the "latest" release and upload the PDF, retrying on
          # the transient API errors GitHub's release endpoint intermittently
          # returns (e.g. "No server is currently available").
          for attempt in 1 2 3 4 5; do
            # Ensure the release exists (ignore "already exists" on retries),
            # and refresh its notes to this commit.
            gh release create latest --title "Latest Build" \
              --notes "$NOTES" --target main >/dev/null 2>&1 \
              || gh release edit latest --notes "$NOTES" >/dev/null 2>&1 || true
            if gh release upload latest "$PDF_NAME" --clobber >/dev/null 2>&1; then
              echo "Uploaded $PDF_NAME to release 'latest'"
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in ${attempt}s"
            sleep "$attempt"
          done
          echo "::error::Could not upload PDF to release 'latest' after 5 attempts"
          exit 1

      - name: Prune old release assets (keep last 3)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Best-effort maintenance: prune excess release assets, retrying on
          # transient API failures. A server error here must not fail the build,
          # since the release and PDF upload already succeeded.
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/latest --jq '.id')
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" --jq \
            '.assets | sort_by(.created_at) | reverse | .[3:] | .[].id' | while read id; do
            echo "Deleting asset $id"
            for attempt in 1 2 3; do
              if gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" --silent; then
                break
              else
                echo "Delete attempt $attempt failed; retrying in ${attempt}s"
                sleep "$attempt"
              fi
            done
          done
