website:
  site-url: "https://yannickloth.github.io/health-me-cfs/"
  title: "Myalgic Encephalomyelitis / Chronic Fatigue Syndrome"
  image: https://yannickloth.github.io/health-me-cfs/logos/og-social.png
  favicon: logos/favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    logo:
      light: logos/ribbon.svg
    left:
      - text: "Home"
        href: index.qmd
      - text: "🇬🇧 Blog (EN)"
        href: en/blog/index.qmd
      - text: "🇫🇷 Blog (FR)"
        href: fr/blog/index.qmd
      - text: "🇩🇪 Blog (DE)"
        href: de/blog/index.qmd
      - text: "FAQ"
        href: faq/index.qmd
    right:
      - text: "About"
        href: about.qmd
      - text: "Download PDF"
        href: loth2026-mecfs.pdf
      - icon: rss
        menu:
          - text: "🇬🇧 RSS (EN)"
            href: en/blog/index.xml
          - text: "🇫🇷 RSS (FR)"
            href: fr/blog/index.xml
          - text: "🇩🇪 RSS (DE)"
            href: de/blog/index.xml
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - section: "Part I — Clinical Presentation"
        contents: part1-clinical/**
      - section: "Part II — Pathophysiology"
        contents: part2-pathophysiology/**
      - section: "Part III — Treatment"
        contents: part3-treatment/**
      - section: "Part IV — Research"
        contents: part4-research/**
      - section: "Part V — Modeling"
        contents: part5-modeling/**
      - text: "---"
      - text: "FAQ"
        href: faq/index.qmd
      - text: "Patient Resources"
        href: patient-resources/index.qmd
      - text: "---"
      - section: "Appendices"
        contents: z-appendices/**

format:
  html:
    # To remove GoatCounter: delete the `include-in-header` block below
    include-in-header:
      - text: |
          <script data-goatcounter="https://yannickloth.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: mathjax
    cite-method: citeproc
    include-after-body: glossary-tooltip.html
    resources:
      - glossary-en.json
      - glossary-fr.json
      - glossary-de.json
      - glossary-tooltip.js
      - part-accordion.js
      - part-chapters.json
      - logos/og-social.png
    crossref:
      sec-prefix: Section
      fig-prefix: Figure
      tbl-prefix: Table
      eq-prefix: Equation
